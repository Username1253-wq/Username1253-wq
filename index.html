    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0.00, "#2a1a4a");
    sky.addColorStop(0.18, "#552f74");
    sky.addColorStop(0.40, "#a94a6f");
    sky.addColorStop(0.62, "#e0724d");
    sky.addColorStop(0.80, "#f7a95e");
    sky.addColorStop(1.00, "#ffd9a3");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Sun bloom low on the horizon.
    const sunX = W * 0.5, sunY = H * 0.86;
    const bloom = ctx.createRadialGradient(sunX, sunY, 20, sunX, sunY, W * 0.62);
    bloom.addColorStop(0,    "rgba(255,244,205,.85)");
    bloom.addColorStop(0.22, "rgba(255,206,140,.42)");
    bloom.addColorStop(0.55, "rgba(255,150,120,.14)");
    bloom.addColorStop(1,    "rgba(255,120,140,0)");
    ctx.fillStyle = bloom;
    ctx.fillRect(0, 0, W, H);

    // Sun disc.
    const disc = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, 96);
    disc.addColorStop(0,   "rgba(255,252,235,.95)");
    disc.addColorStop(0.5, "rgba(255,236,180,.55)");
    disc.addColorStop(1,   "rgba(255,210,140,0)");
    ctx.fillStyle = disc;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 96, 0, Math.PI * 2);
    ctx.fill();

    // Layered cloud banks.
    this._drawCloud(ctx, W * 0.18, H * 0.24, 300, 46, 0.16);
    this._drawCloud(ctx, W * 0.74, H * 0.16, 360, 40, 0.13);
    this._drawCloud(ctx, W * 0.46, H * 0.40, 460, 52, 0.12);
    this._drawCloud(ctx, W * 0.86, H * 0.52, 320, 44, 0.14);
    this._drawCloud(ctx, W * 0.10, H * 0.58, 340, 40, 0.12);

    // Distant ridges, each hazer than the last.
    this._drawRidge(ctx, H * 0.70, 92, "rgba(96,58,104,.42)", 0.9);
    this._drawRidge(ctx, H * 0.78, 72, "rgba(74,44,88,.52)",  1.7);
    this._drawRidge(ctx, H * 0.86, 54, "rgba(52,32,68,.62)",  2.6);
  }

  /** A soft, wind-stretched cloud bank. */
  _drawCloud(ctx, x, y, w, h, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    const g = ctx.createRadialGradient(x, y, 1, x, y, w * 0.5);
    g.addColorStop(0,   "rgba(255,247,235,.95)");
    g.addColorStop(0.6, "rgba(255,226,206,.45)");
    g.addColorStop(1,   "rgba(255,214,200,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(x, y, w * 0.5, h, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /** A jagged silhouette ridge along the horizon. */
  _drawRidge(ctx, baseY, height, color, seed) {
    const W = this.W;
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, this.H);
    ctx.lineTo(0, baseY);
    const step = 84;
    for (let x = 0; x <= W + step; x += step) {
      // Deterministic pseudo-noise, so the ridgeline never flickers.
      const n = Math.sin(x * 0.013 + seed * 2.7) * 0.5 +
                Math.sin(x * 0.031 + seed * 1.3) * 0.5;
      ctx.lineTo(x, baseY - (n * 0.5 + 0.5) * height);
    }
    ctx.lineTo(W, this.H);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /* --------------------------------------------------------------------
     Stage — ancient stone masonry, a mossy grass crown, and pillars
     ------------------------------------------------------------------ */
  _drawStage(ctx) {
    // Pillars first, so the main slab overlaps their tops.
    this._drawPillars(ctx);

    for (const p of STAGE.platforms) if (p.main) this._drawStoneSlab(ctx, p, true);
    for (const p of STAGE.platforms) if (!p.main) this._drawStoneSlab(ctx, p, false);
  }

  _drawStoneSlab(ctx, p, isMain) {
    const grassH = isMain ? 11 : 8;

    // --- stone body ---
    const stone = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
    stone.addColorStop(0,    "#c9c3b4");
    stone.addColorStop(0.35, "#a89f8d");
    stone.addColorStop(1,    "#6f6555");
    ctx.fillStyle = stone;
    ctx.fillRect(p.x, p.y, p.w, p.h);

    // --- masonry joints: courses + staggered vertical seams ---
    ctx.save();
    ctx.strokeStyle = "rgba(60,52,42,.34)";
    ctx.lineWidth = 1.5;
    const courses = 2;
    const block = 46;
    const bodyTop = p.y + grassH;
    const bodyH = p.h - grassH;
    for (let i = 1; i < courses; i++) {
      const y = bodyTop + (bodyH / courses) * i;
      ctx.beginPath();
      ctx.moveTo(p.x, y);
      ctx.lineTo(p.x + p.w, y);
      ctx.stroke();
    }
    for (let i = 0; i < courses; i++) {
      const rowTop = bodyTop + (bodyH / courses) * i;
      const rowBot = bodyTop + (bodyH / courses) * (i + 1);
      const offset = (i % 2) * block * 0.5;
      for (let x = p.x + offset; x < p.x + p.w; x += block) {
        if (x <= p.x + 5) continue;
        ctx.beginPath();
        ctx.moveTo(x, rowTop);
        ctx.lineTo(x, rowBot);
        ctx.stroke();
      }
    }
    ctx.restore();

    // --- bottom shading so the slab reads as thick ---
    ctx.save();
    const shade = ctx.createLinearGradient(0, p.y + p.h * 0.5, 0, p.y + p.h);
    shade.addColorStop(0, "rgba(50,40,32,0)");
    shade.addColorStop(1, "rgba(50,40,32,.45)");
    ctx.fillStyle = shade;
    ctx.fillRect(p.x, p.y + p.h * 0.5, p.w, p.h * 0.5);
    ctx.restore();

    // --- mossy grass crown: an organic, gently undulating cap ---
    const gy = p.y;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(p.x, gy + grassH);
    const teeth = Math.max(6, Math.round(p.w / 26));
    for (let i = 0; i <= teeth; i++) {
      const t = i / teeth;
      const wave = Math.sin(t * Math.PI * 3.1) * 2.2;
      const tuft = (i % 2 === 0) ? -3.4 : 0;
      ctx.lineTo(p.x + t * p.w, gy + wave + tuft);
    }
    ctx.lineTo(p.x + p.w, gy + grassH);
    ctx.closePath();
    const grass = ctx.createLinearGradient(0, gy - 4, 0, gy + grassH);
    grass.addColorStop(0,    "#7ccf62");
    grass.addColorStop(0.55, "#5aab4c");
    grass.addColorStop(1,    "#3d7c38");
    ctx.fillStyle = grass;
    ctx.fill();
    ctx.restore();

    // Bright sunlit lip along the grass.
    ctx.save();
    ctx.strokeStyle = "rgba(220,255,190,.70)";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(p.x + 1, gy - 1.5);
    ctx.lineTo(p.x + p.w - 1, gy - 1.5);
    ctx.stroke();
    ctx.restore();

    // A few hanging moss strands under the slab.
    ctx.save();
    ctx.fillStyle = "rgba(61,124,56,.55)";
    for (let x = p.x + 14; x < p.x + p.w - 10; x += 37) {
      const len = 6 + ((x * 7) % 9);
      ctx.beginPath();
      ctx.moveTo(x, p.y + p.h - 1);
      ctx.lineTo(x + 3.5, p.y + p.h - 1);
      ctx.lineTo(x + 1.8, p.y + p.h + len);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  /**
   * Three angled stone pillars holding the main platform up, running off the
   * bottom of the frame so the stage reads as an ancient ruin.
   */
  _drawPillars(ctx) {
    const main = STAGE.platforms.find((p) => p.main);
    if (!main) return;

    const specs = [
      { x: main.x + main.w * 0.16, w: 54, lean: -12 },
      { x: main.x + main.w * 0.50, w: 66, lean:   4 },
      { x: main.x + main.w * 0.84, w: 54, lean:  14 }
    ];

    for (const s of specs) {
      const topY   = main.y + main.h - 2;
      const botY   = this.H + 20;
      const halfTop = s.w / 2;
      const halfBot = s.w / 2 + 10;   // flares outward toward the base

      const path = () => {
        ctx.beginPath();
        ctx.moveTo(s.x - halfTop, topY);
        ctx.lineTo(s.x + halfTop, topY);
        ctx.lineTo(s.x + s.lean + halfBot, botY);
        ctx.lineTo(s.x + s.lean - halfBot, botY);
        ctx.closePath();
      };

      ctx.save();

      const stone = ctx.createLinearGradient(s.x - halfTop, 0, s.x + halfTop, 0);
      stone.addColorStop(0,    "#6b6152");
      stone.addColorStop(0.35, "#a89f8d");
      stone.addColorStop(0.65, "#8d8471");
      stone.addColorStop(1,    "#5d5445");
      ctx.fillStyle = stone;
      path();
      ctx.fill();

      // Horizontal courses.
      ctx.strokeStyle = "rgba(58,50,40,.30)";
      ctx.lineWidth = 1.4;
      for (let i = 1; i < 6; i++) {
        const t = i / 6;
        const y  = topY + (botY - topY) * t;
        const lx = s.x - halfTop + (s.lean - halfBot + halfTop) * t;
        const rx = s.x + halfTop + (s.lean + halfBot - halfTop) * t;
        ctx.beginPath();
        ctx.moveTo(lx, y);
        ctx.lineTo(rx, y);
        ctx.stroke();
      }

      // Haze the base into the horizon glow.
      const fade = ctx.createLinearGradient(0, botY - 230, 0, botY);
      fade.addColorStop(0, "rgba(255,190,130,0)");
      fade.addColorStop(1, "rgba(255,196,145,.60)");
      ctx.fillStyle = fade;
      path();
      ctx.fill();

      ctx.restore();
    }
  }

  /* --------------------------------------------------------------------
     HUD — classic Smash-style damage readouts along the bottom edge
     ------------------------------------------------------------------ */
  _drawHUD(ctx) {
    const t = this.tournament;

    ctx.save();
    ctx.textBaseline = "alphabetic";
    ctx.shadowColor = "rgba(38,16,44,.62)";
    ctx.shadowBlur = 8;

    // Top centre: which round, which tournament.
    const round = t.currentRound();
    ctx.textAlign = "center";
    ctx.font = uiFont("800 italic", 14);
    ctx.fillStyle = "rgba(255,253,249,.92)";
    ctx.fillText(
      ((round ? round.name : "") + "  ·  TOURNAMENT #" + t.tournamentNumber).toUpperCase(),
      this.W / 2, 34
    );

    // Corner key hints, deliberately understated.
    ctx.textAlign = "left";
    ctx.font = uiFont("700", 10);
    ctx.fillStyle = "rgba(255,253,249,.55)";
    ctx.shadowBlur = 5;
    ctx.fillText("[H] HITBOXES   [B] AI DEBUG", 20, 24);

    // Bottom centre: the two damage readouts, mirrored around the midpoint.
    this._drawSlotHUD(ctx, this.slotFighters[0], this.W / 2 - 52, this.H - 66, "right");
    this._drawSlotHUD(ctx, this.slotFighters[1], this.W / 2 + 52, this.H - 66, "left");

    // Centre rule between them.
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,255,255,.38)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(this.W / 2, this.H - 100);
    ctx.lineTo(this.W / 2, this.H - 30);
    ctx.stroke();

    ctx.restore();
  }

  /** Giant italic percentage + name + stock pips, mirrored around centre. */
  _drawSlotHUD(ctx, fighter, x, y, align) {
    ctx.textAlign = align;
    ctx.textBaseline = "alphabetic";

    const pct  = Math.floor(fighter.damagePercentage);
    const dt   = clamp(fighter.damagePercentage / 130, 0, 1);
    const fill = damageColor(fighter.damagePercentage);

    // The percentage: big, bold, italic — with a dark keyline so it stays
    // legible over the bright horizon.
    ctx.save();
    ctx.font = uiFont("italic 900", 62);
    ctx.lineJoin = "round";
    ctx.lineWidth = 7;
    ctx.strokeStyle = "rgba(38,16,44,.60)";
    ctx.shadowBlur = 0;
    ctx.strokeText(pct + "%", x, y);

    // Glow intensity climbs with damage.
    ctx.shadowColor = fill;
    ctx.shadowBlur = 6 + dt * 26;
    ctx.fillStyle = fill;
    ctx.fillText(pct + "%", x, y);
    ctx.restore();

    // Name
    const nameY = y + 27;
    ctx.font = uiFont("800 italic", 14);
    ctx.fillStyle = "rgba(255,253,249,.95)";
    ctx.shadowColor = "rgba(38,16,44,.6)";
    ctx.shadowBlur = 7;
    ctx.fillText(fighter.name, x, nameY);

    // Stock pips, drawn as circles.
    ctx.shadowBlur = 0;
    const max   = CONFIG.match.stocks;
    const alive = Math.max(0, Math.min(max, fighter.stocksLeft));
    const gap   = 16;
    const r     = 5;
    const span  = (max - 1) * gap;
    const startX = align === "right" ? x - span : x;
    for (let i = 0; i < max; i++) {
      const cxp = startX + i * gap;
      ctx.beginPath();
      ctx.arc(cxp, nameY + 16, r, 0, Math.PI * 2);
      if (i < alive) {
        ctx.fillStyle = "#fffdf9";
        ctx.fill();
      } else {
        ctx.strokeStyle = "rgba(255,253,249,.55)";
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
  }

  /* --------------------------------------------------------------------
     Tournament banner — INTRO / RESULT / CHAMPION overlays
     ------------------------------------------------------------------ */
  _drawTournamentBanner(ctx) {
    const t = this.tournament;
    if (t.phase === TOURNEY_PHASE.FIGHTING) return;

    let big = "", small = "", accent = "#fffdf9", scrim = 0.30;

    if (t.phase === TOURNEY_PHASE.INTRO) {
      const round = t.currentRound();
      const m = t.currentMatch();
      big   = (round ? round.name : "").toUpperCase();
      small = (m && m.a && m.b) ? (m.a.name + "     vs     " + m.b.name) : "";
    } else if (t.phase === TOURNEY_PHASE.RESULT) {
      const winner = t.resultWinner;
      big   = ((winner ? winner.name : "") + " WINS").toUpperCase();
      small = "ADVANCING";
      accent = winner ? winner.color : "#fffdf9";
    } else if (t.phase === TOURNEY_PHASE.CHAMPION) {
      const champ = t.champion;
      big   = "★ CHAMPION ★";
      small = champ ? champ.name : "";
      accent = champ ? champ.color : "#ffd166";
      scrim = 0.52;
    }

    // Gradient veil rather than a flat scrim, to keep the sky breathing.
    const veil = ctx.createLinearGradient(0, 0, 0, this.H);
    veil.addColorStop(0, "rgba(30,12,42," + scrim + ")");
    veil.addColorStop(1, "rgba(62,26,56," + scrim + ")");
    ctx.fillStyle = veil;
    ctx.fillRect(0, 0, this.W, this.H);

    const cy = this.H / 2;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";

    // Big italic headline.
    ctx.font = uiFont("italic 900", 58);
    ctx.lineWidth = 8;
    ctx.strokeStyle = "rgba(28,10,36,.55)";
    ctx.shadowBlur = 0;
    ctx.strokeText(big, this.W / 2, cy - 14);

    ctx.shadowColor = accent;
    ctx.shadowBlur = 32;
    ctx.fillStyle = "#fffdf9";
    ctx.fillText(big, this.W / 2, cy - 14);

    // Underline sized to the text.
    const bw = ctx.measureText(big).width;
    ctx.shadowBlur = 0;
    ctx.fillStyle = accent;
    ctx.fillRect(this.W / 2 - bw / 2, cy + 22, bw, 3);

    // Sub-line.
    if (small) {
      ctx.font = uiFont("800", 22);
      ctx.fillStyle = "#fffdf9";
      ctx.shadowColor = accent;
      ctx.shadowBlur = 14;
      ctx.fillText(small, this.W / 2, cy + 56);
    }
  }

  /* --------------------------------------------------------------------
     AI debug overlay — one terminal readout per bot
     ------------------------------------------------------------------ */
  _drawBotPanels(ctx) {
    if (!this.showDebug) return;
    const w = 268;
    this._drawBotPanel(ctx, this.slotFighters[0], this.slotBrains[0], 24);
    this._drawBotPanel(ctx, this.slotFighters[1], this.slotBrains[1], this.W - 24 - w);
  }

  /**
   * Draws the live decision state of a single brain: current AI state,
   * distance to the enemy, damage, air status, and think timer.
   */
  _drawBotPanel(ctx, fighter, brain, x) {
    const w = 268;
    const h = 166;
    const y = this.H - h - 26;

    const stateColor = AI_STATE_COLORS[brain.state] || "#fffdf9";

    ctx.save();

    // Frosted-glass card, matching the DOM panels.
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 12);
    ctx.fillStyle = "rgba(255,255,255,.13)";
    ctx.fill();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = "rgba(255,255,255,.46)";
    ctx.stroke();

    // Header strip, tinted to the fighter.
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(x, y, w, 27, 12);
    ctx.clip();
    ctx.fillStyle = rgba(fighter.color, 0.34);
    ctx.fillRect(x, y, w, 27);
    ctx.restore();

    ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(34,12,42,.55)";
    ctx.shadowBlur = 6;

    ctx.font = uiFont("800", 12);
    ctx.textAlign = "left";
    ctx.fillStyle = "#fffdf9";
    ctx.fillText(fighter.name, x + 13, y + 14);

    ctx.textAlign = "right";
    ctx.font = uiFont("700", 11);
    ctx.fillStyle = "rgba(255,253,249,.75)";
    ctx.fillText(brain.label, x + w - 13, y + 14);

    // Live rows
    const airLeft = CONFIG.fighter.maxJumps - fighter.jumpsUsed;
    const rows = [
      ["AI STATE",  brain.state, stateColor],
      ["DISTANCE",  Math.round(brain.distance) + " px", "#fffdf9"],
      ["DAMAGE",    Math.floor(fighter.damagePercentage) + "%", damageColor(fighter.damagePercentage)],
      ["AIRBORNE",  fighter.isGrounded ? "no" : "yes  (" + airLeft + " air)", "#fffdf9"],
      ["THINK",     Math.max(0, brain.decisionTimer).toFixed(2) + "s", "#fffdf9"]
    ];

    let ry = y + 48;
    for (const row of rows) {
      ctx.font = uiFont("700", 11);
      ctx.textAlign = "left";
      ctx.fillStyle = "rgba(255,253,249,.62)";
      ctx.fillText(row[0], x + 13, ry);

      ctx.font = uiFont("800", 11);
      ctx.textAlign = "right";
      ctx.fillStyle = row[2];
      ctx.fillText(row[1], x + w - 13, ry);
      ry += 21;
    }

    // Last transition note
    ctx.font = uiFont("600", 10);
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,253,249,.48)";
    ctx.fillText("» " + (brain.lastTransition || "—"), x + 13, ry + 3);

    ctx.restore();
  }
}

/* ---------------------------------------------------------------------------
   8. BOOT
   ------------------------------------------------------------------------ */
const canvas = document.getElementById("game");
const game = new Game(canvas);
game.start();

// Expose for console poking / tuning the brains live.
window.__NEON_BRAWL__ = {
  game, CONFIG, STAGE, STATE, Fighter,
  AIBrain, AI_STATE, AI_PRESETS, AI_STATE_COLORS,
  ControlPanel, SLIDER_SPEC, defaultTuning,
  Tournament, BracketView, TOURNEY_PHASE, ROSTER_DEFS,
  damageColor, mixHex, rgba, hexToRgb, UI_FONT
};
</script>
